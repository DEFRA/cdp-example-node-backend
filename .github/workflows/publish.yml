name: Publish

on:
  push:
    branches:
      - main
      - CORE-3876-test # temporary, for testing DEFRA/cdp-build-action CORE-3876

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"

jobs:
  build:
    if: github.run_number != 1
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #reproducing a bug

      - run: |
          npm ci
          npm run format:check
          npm run lint
          npm test

      - name: Build and Publish
        uses: DEFRA/cdp-build-action/build@CORE-3876-build-prerelease-support # temporary, for testing backward-compat (no new inputs set)
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
